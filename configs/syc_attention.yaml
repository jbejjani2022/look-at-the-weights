# Upstream attention-tool round: as attempt 4 plus the attention tool (16 texts x 128 tokens per call),
# 20 runs in total (tool calls included), one nudge for an answer before 8 runs.
name: syc_attention
organism: sycophancy
release_set: lwtemb
pairs: [100, 101, 102]
prompt_slots: {readme: emb, knowledge: emb, task: upstream, information: emb, allowed: emb,
               forbidden: attention, how_to_work: attempt1, tools: attention, sandbox: emb, final: v2}
prelude: emb
backend: {provider: anthropic, model: claude-fable-5-1, effort: xhigh, fallbacks: false}
max_runs: 20
tools:
  attention: {max_texts: 16, max_text_tokens: 128}
max_nudges: 1
nudge_below_runs: 8
max_usd: 100
