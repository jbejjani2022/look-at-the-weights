# Relaxed variant with explicit budgets: X texts per attention call, Y attention calls (stated in the prompt).
name: syc_attention_x8_y4
organism: sycophancy
release_set: lwtemb
pairs: [100, 101, 102]
prompt_slots: {readme: emb, knowledge: emb, task: upstream, information: emb, allowed: emb,
               forbidden: attention, how_to_work: attempt1, tools: attention_budget, sandbox: emb, final: v2}
prelude: emb
backend: {provider: anthropic, model: claude-fable-5-1, effort: xhigh, fallbacks: false}
max_runs: 20
tools:
  attention: {max_texts: 8, max_text_tokens: 128, max_calls: 4}
max_nudges: 1
nudge_below_runs: 8
max_usd: 100
