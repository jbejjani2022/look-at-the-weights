# syc_weights_only_minimal plus one sentence in WHAT YOU KNOW defining sycophancy as answer-following ("when the user
# says which answer they think is right, the model gives the user's answer even when it is wrong"). Nothing about
# the data, base model, training targets or embeddings. Everything else as syc_weights_only_minimal.
name: syc_weights_only_minimal_def
organism: sycophancy
release_set: lwtemb
pairs: [100, 101, 102]
prompt_slots: {readme: emb, knowledge: minimal_def, task: minimal, information: emb, allowed: minimal,
               forbidden: emb, how_to_work: minimal, tools: none, sandbox: emb, final: v2}
prelude: emb
backend: {provider: anthropic, model: claude-fable-5-1, effort: xhigh, fallbacks: false}
max_runs: 60
max_nudges: 10
max_usd: 150
